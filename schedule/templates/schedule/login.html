{% extends "schedule/base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <h1>🔐 Вход</h1>
    <p class="sub">Панель администратора</p>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <div class="msg msg-error" style="margin-bottom:16px">Неверный логин или пароль</div>
      {% endif %}
      <div class="field">
        <label for="id_username">Логин</label>
        <input type="text" name="username" id="id_username" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="id_password">Пароль</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password">
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
        Войти
      </button>
    </form>
  </div>
</div>
{% endblock %}
