{% extends "schedule/base.html" %}
{% block title %}Вход для студентов{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🔑</div>
      <h1>Вход</h1>
      <p class="auth-subtitle">Войдите, чтобы загружать конспекты и удалять свои материалы</p>
    </div>

    <form method="post" class="auth-form">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" name="username"
               value="{{ post.username|default:'' }}"
               placeholder="Ваше имя пользователя"
               autocomplete="username" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password"
               placeholder="Ваш пароль"
               autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Войти</button>
    </form>

    <div class="auth-footer">
      Нет аккаунта?
      <a href="{% url 'schedule:student_register' %}">Зарегистрироваться</a>
    </div>
  </div>
</div>
{% endblock %}
