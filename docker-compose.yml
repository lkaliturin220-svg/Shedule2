version: "3.9"

services:
  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             gunicorn -c gunicorn.conf.py config.wsgi:application"
    volumes:
      - static_data:/app/staticfiles
      - /mnt/conspects:/app/media
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    ports:
      - "8000:8000"   # убери если используешь NPMplus/Nginx proxy

  tgbot:
    build: .
    command: python manage.py start_tgbot
    env_file: .env
    depends_on:
      - web
      - redis
    restart: always

  sync:
    build: .
    command: python manage.py sync_yadisk --watch
    env_file: .env
    depends_on:
      - web
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       schedule_db
      POSTGRES_USER:     schedule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule -d schedule_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  static_data:
  redis_data:
  pg_data:
