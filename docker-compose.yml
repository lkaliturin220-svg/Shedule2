services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn -c gunicorn.conf.py config.wsgi:application"
    volumes:
      - static_data:/app/staticfiles
      - /mnt/conspects:/app/media
    env_file: .env
    environment:
      - SYNC_ON_REQUEST=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    ports:
      - "8000:8000"   # убери если используешь NPMplus/Nginx proxy

  tgbot:
    build: .
    command: python manage.py start_tgbot
    network_mode: host
    env_file: .env
    restart: always

  sync:
    # Гибридный синк: доставляет в TG очередь уведомлений от web-синка
    # (через socks-прокси xray на хосте) и подстраховывает ленивый синк.
    build: .
    command: >
      sh -c "while true; do
               python manage.py flush_notify || true;
               python manage.py sync_yadisk || true;
               sleep 300;
             done"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # в .env прокси на 127.0.0.1 (для host-network tgbot); здесь мост на хост
      - PROXY_URL=socks5://host.docker.internal:1080
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       schedule_db
      POSTGRES_USER:     schedule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule -d schedule_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  static_data:
  redis_data:
  pg_data:

